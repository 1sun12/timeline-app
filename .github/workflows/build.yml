name: Build

# Every push to main builds the macOS app (the priority platform) and uploads the
# .dmg as a workflow artifact. Pushing a v* tag builds all three platforms and
# attaches them to a draft GitHub Release.
#
# Only `release` and `publish` can write to the repo; every job that runs npm or
# third-party build scripts gets a read-only token. Actions are pinned by commit.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One draft release made up front, so every platform uploads into the same one.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.result }}
    steps:
      - id: create
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: `Timeline ${tag}`, draft: true,
            });
            return data.id;

  build:
    needs: release
    # Runs on plain pushes too, where the release job is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(startsWith(github.ref, 'refs/tags/') && '["macos-latest","ubuntu-22.04","windows-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Tests
        if: matrix.platform == 'macos-latest'
        run: |
          npm test
          npm run check
          cd src-tauri && cargo test

      # The AppImage comes from the appdir/appimage jobs below, with its own glibc inside.
      - run: npx tauri build ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || matrix.platform == 'ubuntu-22.04' && '--bundles deb,rpm' || '' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timeline-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
          if-no-files-found: error

  # A self-contained AppImage: glibc and WebKitGTK ship inside, so it runs on any distro.
  # Built on Arch, which quick-sharun is made for; also runs by hand (Actions > Build > Run workflow).
  appdir:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: archlinux@sha256:375a401bb3c6376b37f40b6dfa25067db37ec78d0b7af67ae6315f43a0184a9d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - run: sh scripts/build-appimage.sh appdir
        env:
          # The debloated-package helper queries the GitHub API; anonymous calls hit the shared rate limit.
          DEBLOAT_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appdir
          path: AppDir.tar
          retention-days: 1
          if-no-files-found: error

  # Packs in a fresh container that never ran npm or the third-party build scripts.
  appimage:
    needs: appdir
    runs-on: ubuntu-latest
    container: archlinux@sha256:375a401bb3c6376b37f40b6dfa25067db37ec78d0b7af67ae6315f43a0184a9d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: appdir

      - run: sh scripts/build-appimage.sh pack
        env:
          # Release builds only: the signing key reaches this step and nothing else.
          REQUIRE_SIGNATURE: ${{ startsWith(github.ref, 'refs/tags/') }}
          APPIMAGE_GPG_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPIMAGE_GPG_KEY || '' }}
          APPIMAGE_GPG_PASSPHRASE: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPIMAGE_GPG_PASSPHRASE || '' }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timeline-appimage
          path: dist/*
          if-no-files-found: error

  # Proves the AppImage is self-contained: it must start on an older glibc than
  # the one it was built with, and on musl.
  smoke:
    needs: appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:20.04
            setup: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb xauth
          - image: alpine:latest
            setup: apk add --quiet xvfb-run coreutils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: timeline-appimage

      # JavaScript actions can't run inside Alpine, so the distro runs under docker here.
      - run: |
          chmod +x Timeline_*.AppImage
          docker run --rm -v "$PWD:/w" -w /w ${{ matrix.image }} sh -c '
            ${{ matrix.setup }} >/dev/null
            timeout 15 xvfb-run -a ./Timeline_*.AppImage --appimage-extract-and-run
            code=$?; echo "exit $code (124 = still running after 15s = started fine)"; [ "$code" = 124 ]'

  publish:
    needs: [release, build, appimage, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: timeline-*
          path: out

      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require("fs"), path = require("path");
            const walk = (d) => fs.readdirSync(d, { withFileTypes: true })
              .flatMap((e) => (e.isDirectory() ? walk(path.join(d, e.name)) : [path.join(d, e.name)]));
            for (const file of walk("out")) {
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: ${{ needs.release.outputs.id }}, name: path.basename(file),
                data: fs.readFileSync(file),
              });
            }
