<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/>
      <stop offset="1" stop-color="#ecdfc4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a648"/>
      <stop offset="1" stop-color="#a8741f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3a2a10" flood-opacity="0.22"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3a2a10" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body inside a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
  <!-- axis -->
  <path d="M190 540H834" stroke="#3b3326" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"/>
  <!-- stems: right angles only -->
  <path d="M380 540V410H430V352" fill="none" stroke="#3b3326" stroke-opacity=".5" stroke-width="12"/>
  <path d="M640 540V668H596V722" fill="none" stroke="#3b3326" stroke-opacity=".5" stroke-width="12"/>
  <!-- cards -->
  <rect x="300" y="236" width="268" height="122" rx="28" fill="#fffdf7" filter="url(#card)"/>
  <rect x="336" y="268" width="80" height="16" rx="8" fill="url(#gold)"/>
  <rect x="336" y="302" width="184" height="22" rx="11" fill="#3b3326" fill-opacity=".72"/>
  <rect x="456" y="718" width="268" height="122" rx="28" fill="#fffdf7" filter="url(#card)"/>
  <rect x="492" y="750" width="80" height="16" rx="8" fill="url(#gold)"/>
  <rect x="492" y="784" width="184" height="22" rx="11" fill="#3b3326" fill-opacity=".72"/>
  <!-- anchors -->
  <circle cx="380" cy="540" r="30" fill="url(#gold)" stroke="#fbf6ea" stroke-width="10"/>
  <circle cx="640" cy="540" r="30" fill="url(#gold)" stroke="#fbf6ea" stroke-width="10"/>
</svg>
